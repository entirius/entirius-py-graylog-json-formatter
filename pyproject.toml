[project]
name = "entirius-py-graylog-json-formatter"
version = "2.0.0"
description = "JSON log formatter for Graylog"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = []

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/entirius/entirius-py-graylog-json-formatter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graylog_json_formatter"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["graylog_json_formatter"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
